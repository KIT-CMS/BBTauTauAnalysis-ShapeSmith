# Run configuration for the sm2018_binned_v2 production (2018 UL, NanoAODv15, renamed database nicks).
# Switches (types and defaults in switches.py):
#   sample_lists: the inventories inventory/<name>.txt, verbatim copies of the KingMaker sample lists of the production
#   jet_fakes:    mc (MC jet fakes + ABCD QCD, works today) | ff (fake factors, needs FF friend trees)
#   embedding:    false (no 2018 v15 embedding ntuples yet)
#   nn_friend:    false (NN categories only once NN friend trees exist; add them under ntuples.friends and re-skim)
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: [sm2018_binned_v2], jet_fakes: mc, embedding: false, nn_friend: false}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v2/CROWNRun
  friends: []
  # - {base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v2/CROWNFriends/nn_v1, applies_to: [mc, data, embedding]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v2/CROWNFriends/ff_v1, applies_to: [mc, data, embedding]}
skim_dir: /ceph/sdaigler/shapesmith/sm2018_binned_v2
output_dir: ../output/sm2018_binned_v2_mc          # relative to this file -> <repo>/output/...
ml_dir: /ceph/sdaigler/shapesmith_ml/sm2018_binned_v2
workers: 16
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
