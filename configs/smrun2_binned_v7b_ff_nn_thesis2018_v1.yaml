# NN phase, step 1 (nn_limit_spec.md 4.2, 9; SH13): R5, the powheg thesis model of R4 (friend FR1 nn_thesis2018_v1, 2018
# only) with the final v7b background model: smrun2_binned_v7b_ff.yaml (EMB in et and mt, jetFakes from the fake-factor
# friend ff_v7b, em as the ttbar control channel, the study uncertainties) with the NN categories of the six thesis
# classes. The NN friend as fastmtt and ff_v7b: data under smrun2_binned_v7, MC and embedding under smrun2_binned_v7b.
#   shapesmith skim -c configs/smrun2_binned_v7b_ff_nn_thesis2018_v1.yaml     # its own skims (the NN friend, em)
#   shapesmith hist / estimate / datacards / fit -c configs/smrun2_binned_v7b_ff_nn_thesis2018_v1.yaml
#   datacards --channels et,mt,tt: the final state 'all' without em, as the thesis (R3, R4)
# The model is the powheg model of the friend (nn_prefix nn_thesis_powheg_; the skims keep the columns of both models of
# the friend, nn_friend_prefixes). It has the six thesis classes, but the fake-factor background model would give the
# classes of v7b5, so nn_classes names them (thesis6, the order of predicted_class); the categories and binning of the
# thesis: nn_categories thesis (argmax), nn_binning thesis.
# Systematics stage S0 (spec 8): the S0+ switches ttbar_shape (SH7) and heavy_flavour (SH8) are off; S0+ adds
# -s switches.ttbar_shape=true -s switches.heavy_flavour=true. heavy_flavour reads bpair_hadronFlavour_{1,2} (MC): skim
# with it on, so that one skim serves S0 and S0+.
analysis: bbtautau_shapesmith.analysis:build
era: "2018"                                               # FR1 is a 2018 production
channels: [et, mt, tt, em]                                # em: the ttbar control channel (in every final state)
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: ff, embedding: [et, mt], crown_shifts: false, nn_friend: true, fastmtt_friend: true, fit_categories: nn, control_regions: false, dy_correction: njets_btag, study_uncertainties: true, symmetrise_ff_shifts: true, ff_processes: [QCD, ttbar],
           nn_prefix: nn_thesis_powheg_, nn_friend_prefixes: [nn_thesis_nodesm_, nn_thesis_powheg_], nn_classes: [HH2B2Tau, DY, ST, TT, VV, Other],
           nn_categories: thesis, nn_binning: thesis}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:                                                # the tau channels only: the em skim reads no friend
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/ff_v7b, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/ff_v7b, applies_to: [mc, embedding], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/nn_thesis2018_v1, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/nn_thesis2018_v1, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/tau_ff_nn_thesis2018_v1/{era}   # its own (NN friend, em)
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_ff_nn_thesis2018_v1/{era}
workers: 16                                               # at most 16 cores on deepthought2 (taskset -c 16-31)
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
