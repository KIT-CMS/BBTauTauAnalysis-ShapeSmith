# SM 2018 fake-factor measurement (`shapesmith measure`) on the sm2018_binned_v5 production, with embedding: derives the
# production payload.
# Switches (types and defaults in switches.py):
#   sample_lists: the inventories inventory/<name>.txt of the production
#   embedding:    true subtracts the genuine taus as EMB (needs the embedding list in sample_lists)
analysis: bbtautau_shapesmith.ff_measurement:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: [sm2018_binned_v3, sm2018_embedding], embedding: true}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v5/CROWNRun
  friends: []
skim_dir: /ceph/sdaigler/shapesmith/ff_sm2018_binned_v5   # its own skims: both charges and the lepton vetoes stored, not applied
output_dir: ../output/ff_sm2018_binned_v5                 # -> fake_factors/2018/
workers: 16
log_level: DEBUG                                          # DEBUG | INFO | WARNING | ERROR; console and <output_dir>/logs/<command>_<time>.log
# web gallery (shapesmith publish): the plots of the measurement, one column per measurement (named by its payload)
web:
  dir: /web/sdaigler/public_html/ff_sm2018_binned_v5
  variant: payload_2026_10_03
  label: fake-factors-2026-10-03
  description: "FF measurement on sm2018_binned_v5 with τ-embedding for the genuine τh; in CROWN as payloads/fake_factors/sm/fake-factors-2026-10-03 (friends ff_v1)."
  title: "sm2018_binned_v5 · fake factors"
  about: |
    Fake-factor measurement of the HH→bbττ 2018 analysis (NanoAODv15, production sm2018_binned_v5) with ShapeSmith, the TauFakeFactors method:
    QCD fake factors from data, ttbar fake factors from MC times a global data/MC factor, the QCD and ttbar fractions,
    the QCD DR→SR correction (measured with orthogonal fake factors) and the non-closure corrections in table order.
    Genuine τh are subtracted with the τ-embedding.

    Each correction shows its p-value against 1; a correction with p > 0.05 is set to 1.
    The summary lists the ttbar data/MC factors; the first ttbar non-closure (decay mode) absorbs them.
