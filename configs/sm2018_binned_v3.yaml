# Run configuration for the sm2018_binned_v3 production (2018 UL, NanoAODv15, using the v2 sample list).
# Switches (all optional, defaults in analysis.py):
#   sample_list: which inventory/<sample_list>.txt lists the samples to process (independent of ntuples.base)
#   jet_fakes:  mc (MC jet fakes + ABCD QCD, works today) | ff (fake factors, needs FF friend trees)
#   embedding:  false (no 2018 v15 embedding ntuples yet)
#   nn_friend:  false (NN categories only once NN friend trees exist; add them under ntuples.friends and re-skim)
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_list: sm2018_binned_v2, jet_fakes: mc, embedding: false, nn_friend: false}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v3/CROWNRun
  friends: []
skim_dir: /ceph/sdaigler/shapesmith/sm2018_binned_v3
output_dir: ../output/sm2018_binned_v3_mc          # relative to this file -> <repo>/output/...
ml_dir: /ceph/sdaigler/shapesmith_ml/sm2018_binned_v3
workers: 16
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
