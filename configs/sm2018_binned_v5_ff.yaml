# HH->bbtautau tau channels on the sm2018_binned_v5 production with fake factors: jetFakes from the FF friend ff_v1
# (payload measured with configs/ff_sm2018_binned_v5.yaml) instead of the MC jet fakes and ABCD QCD, embedding for the
# genuine taus. Own skim_dir and output_dir: the skim selection differs from sm2018_binned_v5.yaml (control_regions
# needs jet_fakes: mc), so the two runs cannot share a skim, and the control shapes of both modes stay apart.
# Switches (types and defaults in switches.py):
#   sample_lists:      the inventories inventory/<name>.txt of the production
#   jet_fakes:         ff (fake factors from the FF friend)
#   ff_type:           corrected (default; the raw FF in sm2018_binned_v5_rawff.yaml)
#   embedding:         true (genuine tautau from the embedded samples)
#   nn_friend:         false (no NN friend yet: no categories, so no shapes.root, datacards or fit)
#   control_regions:   false (requires jet_fakes: mc)
#   shape_systematics: true (default) declares the embedding and fake-factor CROWN shifts
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: [sm2018_binned_v3, sm2018_embedding], jet_fakes: ff, embedding: true, nn_friend: false, control_regions: false}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v5/CROWNRun
  friends:
    - {base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v5/CROWNFriend/ff_v1, applies_to: [mc, data, embedding]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/sm2018_binned_v5/CROWNFriend/nn_v1, applies_to: [mc, data, embedding]}
skim_dir: /ceph/sdaigler/shapesmith/sm2018_binned_v5_ff   # not shared with sm2018_binned_v5.yaml (different skim selection)
output_dir: ../output/sm2018_binned_v5_ff                 # relative to this file -> <repo>/output/...
ml_dir: /ceph/sdaigler/shapesmith_ml/sm2018_binned_v5_ff
workers: 16
log_level: DEBUG                                          # DEBUG | INFO | WARNING | ERROR; console and <output_dir>/logs/<command>_<time>.log
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
# web gallery (shapesmith publish)
web:
  dir: /web/sdaigler/public_html/sm2018_binned_v5
  variant: emb_ff
  label: emb ff
  description: "τ-embedding + jet→τh fakes from the fully corrected fake factor (friend ff_v1, payload fake-factors-2026-10-03: fractions, QCD DR→SR, non-closure corrections)."
