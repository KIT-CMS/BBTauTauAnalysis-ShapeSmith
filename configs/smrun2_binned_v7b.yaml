# v7b: the MC and the embedding re-produced as smrun2_binned_v7b (the MET fix of 2026-10-18: DY and W recoil-corrected
# in 2018 only, without recoil correction in 2016 and 2017; the POG muon_Z trigger SF on MC, E5), the data stay in
# smrun2_binned_v7: ntuples.base is the data production, ntuples.bases the MC and embedding one, and every friend is
# split by applies_to likewise. Skims, outputs and galleries under smrun2_binned_v7b; the smrun2_binned_v7 run YAMLs
# keep reproducing the v7 results.
# Decision of 2026-10-19 (E33): the tt-embedding closure (12.7.5) failed in every era, so tt takes its genuine taus
# from MC as in v6 and only et and mt keep the embedding: switches.embedding [et, mt] (was [et, mt, tt]).
# HH->bbtautau tau channels on smrun2_binned_v7b (v7 production P3 with the MC and embedding of v7b: Run 2 UL NanoAODv15,
# all four eras, data/MC in six scopes and the embedding in et/mt/tt, nominal only, E34). One YAML for every era (6.11):
#   shapesmith <command> -c configs/smrun2_binned_v7b.yaml -s era=<2016preVFP | 2016postVFP | 2017 | 2018>
# {era} in paths, sample lists and web texts is filled with the era of the run.
# Control run, gallery column "emb": MC jet fakes and ABCD QCD, genuine tautau from the embedding in et and mt and from
# MC in tt (E33, decision above), QCD in the
# control regions, DY corrected in n_jets x n_bjets. The column "classic" is smrun2_binned_v7b_noemb.yaml on the same skims.
# Switches (types and defaults in switches.py):
#   sample_lists:      the inventories of the era: sm_<era>_binned and sm_<era>_embedding (copies of the CROWN lists)
#                      and sm_<era>_borrowed (2016postVFP: VH -> tautau of 2016preVFP, spec 3.3; empty otherwise)
#   jet_fakes:         mc (MC jet fakes + ABCD QCD)
#   embedding:         [et, mt] (tt: MC genuine tautau, E33 decision of 2026-10-19)
#   crown_shifts:      false (nominal-only production, E34: no embedding tau shifts; b-tag and prefiring weight
#                      variations and the FF friend shifts stay)
#   control_regions:   true (wider skim plus the named control regions), diagnostics: true (QCD there, npv_good, rho, ...)
#   dy_correction:     njets_btag (DY_NJETS_BTAG of the era, constants.py: the tables of the smrun2_binned_v7b_dilepton.yaml
#                      runs)
# 2026-10-20: the FastMTT friend (P4 fastmtt: data under v7, MC and embedding under v7b) for the control variables
# m, pt, eta and phi_fastmtt of et, mt and tt (switch fastmtt_friend).
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: mc, embedding: [et, mt], crown_shifts: false, nn_friend: false, fastmtt_friend: true, control_regions: true, diagnostics: true, dy_correction: njets_btag}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout (feat-run2-nanoaodv15-samples 0de63ebe or later); relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data; <base>/<era>/<nick>/<channel>/
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:                                                # the tau channels only
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/tau_control/{era}      # shared with smrun2_binned_v7b_noemb.yaml
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_control_emb/{era}
ml_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/ml/tau_control/{era}
workers: 16                                               # at most 24 on portal2
log_level: DEBUG                                          # DEBUG | INFO | WARNING | ERROR; console and <output_dir>/logs/<command>_<time>.log
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
# web gallery of the era (shapesmith publish), columns classic (smrun2_binned_v7b_noemb.yaml, smrun2_binned_v7b_dilepton.yaml),
# emb (this run), emb ff (smrun2_binned_v7b_ff.yaml) and emb ff with W (smrun2_binned_v7b_ff_w.yaml); title and about here
web:
  site: /web/sdaigler/public_html/smrun2_binned_v7b  # one page with an era switch, the eras in its subdirectories
  dir: "/web/sdaigler/public_html/smrun2_binned_v7b/{era}"
  variant: emb
  label: emb
  description: "τ-embedding for genuine ττ, MC jet→τh fakes, QCD from the ABCD method (also in the control regions), DY corrected in n_jets × n_bjets; et and mt only (tt has no embedding, see classic)."
  title: "smrun2_binned_v7b · control plots"
  about: |
    HH→bbττ {era} (Run 2 UL, NanoAODv15), CROWN productions smrun2_binned_v7 (data) and smrun2_binned_v7b (MC and
    τ-embedding with the MET fix and the POG muon trigger SF on MC), nominal only; histograms and plots by ShapeSmith.
    Columns: classic (MC genuine ττ, MC jet fakes; et, mt, tt and the dilepton controls em, mm, ee), emb (τ-embedding in
    et and mt, MC genuine ττ in tt), emb ff (τ-embedding + fake factors ff_v7b: QCD and ttbar; em as the ttbar control) and emb ff with W
    (τ-embedding + fake factors ff_v7b_w: QCD, W+jets and ttbar).

    Nominal region: opposite sign, b pair with ≥ 1 b-tag (WPs T and M), isolated τh, mT < 70 GeV, |η(τh)| < 2.3 and
    |η(ℓ)| < 2.1 in et and mt; the HEM veto in 2018. Regions btag0_os_pass to btag3p_os_pass in classic and emb.
    Plots are prefit, without systematic uncertainties.
