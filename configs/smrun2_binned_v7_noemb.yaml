# HH->bbtautau tau channels on smrun2_binned_v7 without embedding (v7 spec 6.11 "noemb"), one YAML for every era:
#   shapesmith <command> -c configs/smrun2_binned_v7_noemb.yaml -s era=<era>
# Control run, gallery column "classic": genuine tautau and jet fakes from MC, QCD from the ABCD method, DY corrected.
# The same skims as smrun2_binned_v7.yaml (one skim holds the embedded samples and every MC part), its own output_dir;
# the switches are those of smrun2_binned_v7.yaml with embedding: false.
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: mc, embedding: false, crown_shifts: false, nn_friend: false, control_regions: true, diagnostics: true, dy_correction: njets_btag}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun
  friends: []
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7/skims/tau_control/{era}      # shared with smrun2_binned_v7.yaml
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7/output/tau_control_noemb/{era}
workers: 16                                               # at most 24 on portal2
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
# web gallery of the era: the tau channels of the column "classic" (the dilepton run adds em, mm, ee)
web:
  dir: "/web/sdaigler/public_html/smrun2_binned_v7/{era}"
  variant: classic
  label: classic
  description: "MC for genuine ττ and jet→τh fakes, QCD from the ABCD method; the dilepton controls em, mm and ee (MC, DY uncorrected)."
