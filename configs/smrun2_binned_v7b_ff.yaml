# v7b: the MC and the embedding re-produced as smrun2_binned_v7b (the MET fix of 2026-10-18: DY and W recoil-corrected
# in 2018 only, without recoil correction in 2016 and 2017; the POG muon_Z trigger SF on MC, E5), the data stay in
# smrun2_binned_v7: ntuples.base is the data production, ntuples.bases the MC and embedding one, and every friend is
# split by applies_to likewise. Skims, outputs and galleries under smrun2_binned_v7b; the smrun2_binned_v7 run YAMLs
# keep reproducing the v7 results.
# HH->bbtautau tau channels on smrun2_binned_v7b with fake factors, variant QCD + ttbar (friend ff_v7b), and em as the
# ttbar control channel of the fits; the datacards of an era and the Run-2 combination (spec 6.9). One YAML for every era:
#   shapesmith <command> -c configs/smrun2_binned_v7b_ff.yaml -s era=<era>
#   hist --control --skip-systematics, estimate --control, plot --control      # gallery column "emb ff"
#   hist --skip-systematics, estimate, datacards, fit --background-only        # categories nominal (tau channels), em_tt
#   shapesmith combine -c configs/smrun2_binned_v7b_ff.yaml --era 2016preVFP --era 2016postVFP --era 2017 --era 2018 \
#       -o /ceph/sdaigler/shapesmith/smrun2_binned_v7b/combination/ff [--background-only] [--validate]
# Switches (types and defaults in switches.py):
#   sample_lists:      the inventories of the era (sm_<era>_borrowed: VH -> tautau of 2016postVFP from 2016preVFP)
#   jet_fakes:         ff (jetFakes from the FF friend ff_v7b: data minus genuine and lepton fakes in anti_iso)
#   embedding:         [et, mt, tt], as the FF measurement of the payload (E33; [et, mt] if tt keeps MC)
#   crown_shifts:      false (nominal only, E34); the FF friend shifts and the b-tag and prefiring weight variations stay
# P5 for v7b: ff_v7b of the data under smrun2_binned_v7, of the MC and embedding under smrun2_binned_v7b, both from the
#   payload of ff_smrun2_binned_v7b.yaml. The friend ff_v7b must carry its FF shift keys (CROWN shifts of the friend,
#   friend_common.py), so produce it with --shifts all as ff_v2 in v6, not with the --shifts None of spec E34 (P2-P5):
#   the skim refuses a declared FF shift without its shifted branch. Without them: -s switches.shape_systematics=false
#   (no FF shapes in the cards).
#   fit_categories:    control (one category 'nominal' per tau channel and em_tt in em, without NN friends)
#   dy_correction:     njets_btag (needs the DY table of the era)
#   ff_processes:      [QCD, ttbar], the payload of ff_v7b (smrun2_binned_v7b_ff_w.yaml: QCD, W+jets, ttbar)
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt, em]                                # em: the ttbar control channel (in every final state)
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: ff, embedding: [et, mt, tt], crown_shifts: false, nn_friend: false, fit_categories: control, control_regions: false, dy_correction: njets_btag, ff_processes: [QCD, ttbar]}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:                                                # the tau channels only: the em skim reads no friend
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/ff_v7b, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/ff_v7b, applies_to: [mc, embedding], channels: [et, mt, tt]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/tau_ff/{era}           # its own (friend ff_v7b, em)
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_ff/{era}
ml_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/ml/tau_ff/{era}
workers: 16                                               # at most 24 on portal2
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}   # with CombineHarvester (ValidateDatacards.py)
# web gallery of the era: the column "emb ff" (et, mt, tt and em)
web:
  dir: "/web/sdaigler/public_html/smrun2_binned_v7b/{era}"
  variant: emb_ff
  label: emb ff
  description: "τ-embedding + jet→τh fakes from the fully corrected fake factor of QCD and ttbar (friend ff_v7b: fractions, QCD DR→SR, non-closure corrections); em is the ttbar control channel."
