# NN phase, input validation (nn_limit_spec.md 7.1, NV1, NV3; nn_validation.py): the control regions of the emb control run
# smrun2_binned_v7b.yaml (MC jet fakes, ABCD QCD and the QCD of the control regions, EMB in et/mt) with the NN inputs as
# control variables in fine bins, the PRELIMINARY pseudo-shifts and the anti-isolated region anti_iso with the fake factor of
# the friend ff_v7b on every process (switch ff_transfer: the shapes of the MC jet fakes there against the nominal region,
# with the FF friend shifts). Its own re-skim with the columns of the re-skim X8 (bpair_mass, jtag_value) and the FF friend,
# outputs under /ceph/sdaigler/shapesmith_test/nn-validate; noemb: -s switches.embedding=false -s output_dir=...
#   shapesmith skim -c configs/smrun2_binned_v7b_nn_validation_control.yaml -s era=<era>
#   shapesmith hist -c configs/smrun2_binned_v7b_nn_validation_control.yaml -s era=<era> --control --regions <regions>
#   shapesmith estimate -c configs/smrun2_binned_v7b_nn_validation_control.yaml -s era=<era> --control
#   shapesmith input-gof -c configs/smrun2_binned_v7b_nn_validation_control.yaml --era ... --region <control region> -o ...
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: mc, embedding: [et, mt], crown_shifts: false, nn_friend: false, fit_categories: none, fastmtt_friend: true, control_regions: true, diagnostics: true, dy_correction: njets_btag, nn_validation: true, pseudo_shifts: true, ff_transfer: true}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/ff_v7b, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/ff_v7b, applies_to: [mc, embedding], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith_test/nn-validate/skims/tau_control_nn/{era}
output_dir: /ceph/sdaigler/shapesmith_test/nn-validate/output/tau_control_nn/{era}
workers: 16
log_level: INFO
# Migrad again with strategy 0 when a fit fails (status -1): a failed observed fit gives a saturated statistic of
# ~1000 and frequentist toys generated around the failed fit (input-gof)
combine:
  cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9
  scram_arch: el9_amd64_gcc12
  parallel: 16
  minimizer: --cminFallbackAlgo Minuit2,Migrad,0:0.1
