# v7b: the MC and the embedding re-produced as smrun2_binned_v7b (the MET fix of 2026-10-18: DY and W recoil-corrected
# in 2018 only, without recoil correction in 2016 and 2017; the POG muon_Z trigger SF on MC, E5), the data stay in
# smrun2_binned_v7: ntuples.base is the data production, ntuples.bases the MC and embedding one, and every friend is
# split by applies_to likewise. Skims, outputs and galleries under smrun2_binned_v7b; the smrun2_binned_v7 run YAMLs
# keep reproducing the v7 results.
# Decision of 2026-10-19 (E33): the tt-embedding closure (12.7.5) failed in every era, so tt takes its genuine taus
# from MC as in v6 and only et and mt keep the embedding: switches.embedding [et, mt] (was [et, mt, tt]).
# HH->bbtautau tau channels on smrun2_binned_v7b with fake factors, variant QCD + W+jets + ttbar (friend ff_v7b_w), and em as
# the ttbar control channel of the fits; the datacards of an era and the Run-2 combination (spec 6.9). One YAML for every era:
#   shapesmith <command> -c configs/smrun2_binned_v7b_ff_w.yaml -s era=<era>
#   hist --control --skip-systematics, estimate --control, plot --control      # gallery column "emb ff with W"
#   hist --skip-systematics, estimate, datacards, fit --background-only        # categories nominal (tau channels), em_tt
#   shapesmith combine -c configs/smrun2_binned_v7b_ff_w.yaml --era 2016preVFP --era 2016postVFP --era 2017 --era 2018 \
#       -o /ceph/sdaigler/shapesmith/smrun2_binned_v7b/combination/ff_w [--background-only] [--validate]
# Switches (types and defaults in switches.py):
#   sample_lists:      the inventories of the era (sm_<era>_borrowed: VH -> tautau of 2016postVFP from 2016preVFP)
#   jet_fakes:         ff (jetFakes from the FF friend ff_v7b_w: data minus genuine and lepton fakes in anti_iso)
#   embedding:         [et, mt], as the FF measurement of the payload (tt: MC genuine tautau, E33 decision of 2026-10-19)
#   crown_shifts:      false (nominal only, E34); the FF friend shifts and the b-tag and prefiring weight variations stay
# P5 for v7b: ff_v7b_w of the data under smrun2_binned_v7, of the MC and embedding under smrun2_binned_v7b, both from the
#   payload of ff_smrun2_binned_v7b_w.yaml. The friend ff_v7b_w must carry its FF shift keys (CROWN shifts of the friend,
#   friend_common.py), so produce it with --shifts all as ff_v2 in v6, not with the --shifts None of spec E34 (P2-P5):
#   the skim refuses a declared FF shift without its shifted branch. Without them: -s switches.shape_systematics=false
#   (no FF shapes in the cards).
#   fit_categories:    control (one category 'nominal' per tau channel and em_tt in em, without NN friends)
#   dy_correction:     njets_btag (needs the DY table of the era)
#                      and the lnN CMS_htt_dy_table_<era> on its DY processes (constants.DY_TABLE_LNN, spec 6.7)
#   study_uncertainties: true (the uncertainties sized in the v7b studies, study_uncertainties.py and
#                      /ceph/sdaigler/v7_results/systematics_v7b_summary.md: embedding tau ID and ES, POG MC tau ES, vsJet
#                      components and di-tau trigger, MET residual, HIPM, FF decay-mode non-closure and 2016 halves, K4)
#   symmetrise_ff_shifts: true (2026-10-19): the datacards replace the fake-factor friend shifts whose Up and Down move a
#                      process to the same side of the nominal or one side by more than twice the other by a symmetric
#                      pair around the nominal (shapesmith.datacards: half the distance of Down to Up, one-sided the
#                      larger shift; per bin); the mt QCD non-closure shifts of 2017/2018 (-8/+28 %) made robustHesse drop
#                      them. The cards leave out every nuisance that is a no-op (Up = Down = nominal everywhere).
#   ff_processes:      [QCD, Wjets, ttbar], the payload of ff_v7b_w: the W+jets keys of the friend shifted in et and mt
#                      (constants.FF_SHIFTS_W; smrun2_binned_v7b_ff.yaml: QCD + ttbar)
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt, em]                                # em: the ttbar control channel (in every final state)
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: ff, embedding: [et, mt], crown_shifts: false, nn_friend: false, fit_categories: control, control_regions: false, dy_correction: njets_btag, study_uncertainties: true, symmetrise_ff_shifts: true, ff_processes: [QCD, Wjets, ttbar]}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:                                                # the tau channels only: the em skim reads no friend
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/ff_v7b_w, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/ff_v7b_w, applies_to: [mc, embedding], channels: [et, mt, tt]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
  # - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/tau_ff_w/{era}         # its own (friend ff_v7b_w, em)
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_ff_w/{era}
ml_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/ml/tau_ff_w/{era}
workers: 16                                               # at most 24 on portal2
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}   # with CombineHarvester (ValidateDatacards.py)
# web gallery of the era: the column "emb ff with W" (et, mt, tt and em)
web:
  site: /web/sdaigler/public_html/smrun2_binned_v7b  # one page with an era switch, the eras in its subdirectories
  dir: "/web/sdaigler/public_html/smrun2_binned_v7b/{era}"
  variant: emb_ff_w
  label: emb ff with W
  description: "τ-embedding + jet→τh fakes from the fully corrected fake factor of QCD, W+jets (et, mt) and ttbar (friend ff_v7b_w: three-process fractions, QCD and W+jets DR→SR, non-closure corrections); em is the ttbar control channel; et and mt only (tt has no embedding, see ff)."
