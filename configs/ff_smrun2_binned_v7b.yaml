# v7b: the MC and the embedding re-produced as smrun2_binned_v7b (the MET fix of 2026-10-18: DY and W recoil-corrected
# in 2018 only, without recoil correction in 2016 and 2017; the POG muon_Z trigger SF on MC, E5), the data stay in
# smrun2_binned_v7: ntuples.base is the data production, ntuples.bases the MC and embedding one, and every friend is
# split by applies_to likewise. Skims, outputs and galleries under smrun2_binned_v7b; the smrun2_binned_v7 run YAMLs
# keep reproducing the v7 results.
# Decision of 2026-10-19 (E33): the tt-embedding closure (12.7.5) failed in every era, so tt takes its genuine taus
# from MC as in v6 and only et and mt keep the embedding: switches.embedding [et, mt] (was [et, mt, tt]).
# SM fake-factor measurement (`shapesmith measure`, v7 spec 6.8, E18) on smrun2_binned_v7b, variant QCD + ttbar: the
# payload of the friend ff_v7b. One YAML for every era:
#   shapesmith skim    -c configs/ff_smrun2_binned_v7b_w.yaml -s era=<era>   # once for both variants (its columns contain these)
#   shapesmith measure -c configs/ff_smrun2_binned_v7b.yaml -s era=<era> --suggest-binning   # edges for ff_edges.py (scripts/ff_binning.py)
#   shapesmith measure -c configs/ff_smrun2_binned_v7b.yaml -s era=<era>                      # -> <output_dir>/fake_factors/<era>/
# Eras: 2016 (both halves in one measurement, one payload for 2016preVFP and 2016postVFP; the lists sm_2016_binned and
# sm_2016_embedding stand for those of both halves), 2017 and 2018; 2016preVFP and 2016postVFP alone are the cross-check
# of the 2016 payload (scripts/compare_ff_payloads.py). Every era has its edges since 2026-10-19 (ff_edges.py).
# The cross-check without embedding: -s switches.embedding=false -s output_dir=/ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/ff_noemb
# Switches (types and defaults in switches.py):
#   sample_lists:       the inventories of the era (VH -> tautau is not subtracted: no borrowed list)
#   embedding:          [et, mt] subtracts the genuine taus as EMB in et and mt and as MC in tt, as the analysis runs
#                       (E33 decision of 2026-10-19)
#   dy_correction:      njets_btag, as the analysis runs (needs the DY table of the era, spec 6.10)
#   tt_fraction_region: application (each leg's fractions where its fake factor is applied, as v6)
#   ff_processes:       [QCD, ttbar]; ff_smrun2_binned_v7b_w.yaml is the variant with W+jets
analysis: bbtautau_shapesmith.ff_measurement:build
era: "2018"
channels: [et, mt, tt]
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_embedding"], embedding: [et, mt], dy_correction: njets_btag, tt_fraction_region: application, ff_processes: [QCD, ttbar]}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends: []
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/ff_measurement/{era}   # shared by both variants: both charges, the lepton vetoes stored
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output                     # -> fake_factors/<era>/ (the W variant: fake_factors_w/<era>/)
workers: 12                                               # at most 24 on portal2
log_level: DEBUG
# web gallery of the era (shapesmith publish): the plots of the measurement, one column per variant
web:
  dir: "/web/sdaigler/public_html/ff_smrun2_binned_v7b/{era}"
  variant: ff_v7b
  label: ff_v7b (QCD, ttbar)
  description: "FF measurement on smrun2_binned_v7b {era}, QCD and ttbar fake factors, genuine τh subtracted with the τ-embedding in et and mt (tt: MC); the payload of the friend ff_v7b."
  title: "smrun2_binned_v7b {era} · fake factors"
  about: |
    Fake-factor measurement of the HH→bbττ analysis, era {era} (Run 2 UL, NanoAODv15, productions smrun2_binned_v7 and
    v7b) with ShapeSmith, the TauFakeFactors method: QCD fake factors from data, ttbar fake factors from MC times a data/MC factor,
    in the variant with W+jets also W+jets fake factors from data with a DR→SR correction from W MC; the process fractions,
    the QCD DR→SR correction and the non-closure corrections in table order. 2016 is one measurement of both halves.

    Each correction shows its p-value against 1; a correction with p > 0.05 is set to 1.
