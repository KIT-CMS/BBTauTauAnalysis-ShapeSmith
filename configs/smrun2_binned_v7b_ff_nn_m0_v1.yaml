# NN phase, step 1 (nn_limit_spec.md 4.2, 9; SH13): R6-R8 and the baseline, the models M0 (2 outer folds) and M0-k4 (4
# folds, N28) of the friend FR2 nn_m0_v1 (CROWN sm_nn_classifier, every Run-2 era, chained on the FastMTT friend; data
# under smrun2_binned_v7, MC and embedding under smrun2_binned_v7b, as fastmtt and ff_v7b) with the final v7b background
# model: smrun2_binned_v7b_ff.yaml (EMB in et and mt, jetFakes from the fake-factor friend ff_v7b, em as the ttbar
# control channel, the study uncertainties) and the NN categories of the five classes v7b5 (N3, the class order of the
# export). One YAML for every era; the variant with W+jets fake factors is smrun2_binned_v7b_ff_w_nn_m0_v1.yaml (N7).
#   shapesmith skim -c configs/smrun2_binned_v7b_ff_nn_m0_v1.yaml -s era=<era>     # its own skims (the NN friend, em)
#   shapesmith hist / estimate / datacards / fit -c configs/smrun2_binned_v7b_ff_nn_m0_v1.yaml -s era=<era>
#   shapesmith combine -c configs/smrun2_binned_v7b_ff_nn_m0_v1.yaml --era 2016preVFP --era 2016postVFP --era 2017 \
#       --era 2018 -o /ceph/sdaigler/shapesmith/smrun2_binned_v7b/combination/ff_nn_m0_v1
# The model of a run is one column prefix of the friend (M0 or M0-k4, e.g. nn_m0_ and nn_m0k4_ as in the example of the
# friend's MODELS): the NN switches of SH1-SH3 (feat/nn-categories) are added at the merge of the NN branches, e.g.
# nn_prefix: nn_m0_, nn_categories: k1 (k2 if R7 chooses it, N10), nn_binning: data_blind; M0-k4 runs with its own
# output_dir (-s "output_dir=/ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_ff_nn_m0k4_v1/{era}").
# Systematics stage S0 (spec 8): the S0+ switches ttbar_shape (SH7) and heavy_flavour (SH8) are off; S0+ adds
# -s switches.ttbar_shape=true -s switches.heavy_flavour=true. heavy_flavour reads bpair_hadronFlavour_{1,2} (MC): skim
# with it on, so that one skim serves S0 and S0+. S1 (with the shift production P6) adds signal_theory.
analysis: bbtautau_shapesmith.analysis:build
era: "2018"
channels: [et, mt, tt, em]                                # em: the ttbar control channel (in every final state)
switches: {sample_lists: ["sm_{era}_binned", "sm_{era}_borrowed", "sm_{era}_embedding"], jet_fakes: ff, embedding: [et, mt], crown_shifts: false, nn_friend: true, fastmtt_friend: true, fit_categories: nn, control_regions: false, dy_correction: njets_btag, study_uncertainties: true, symmetrise_ff_shifts: true, ff_processes: [QCD, ttbar]}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNRun      # the data
  bases:                                                  # the MC and the embedding: the re-production
    mc: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
    embedding: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNRun
  friends:                                                # the tau channels only: the em skim reads no friend
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/ff_v7b, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/ff_v7b, applies_to: [mc, embedding], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/fastmtt, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/fastmtt, applies_to: [mc, embedding], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7/CROWNFriend/nn_m0_v1, applies_to: [data], channels: [et, mt, tt]}
    - {base: /store/user/sdaigler/CROWN/ntuples/smrun2_binned_v7b/CROWNFriend/nn_m0_v1, applies_to: [mc, embedding], channels: [et, mt, tt]}
skim_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/skims/tau_ff_nn_m0_v1/{era}   # its own (NN friend, em)
output_dir: /ceph/sdaigler/shapesmith/smrun2_binned_v7b/output/tau_ff_nn_m0_v1/{era}
workers: 16                                               # at most 16 cores on deepthought2 (taskset -c 16-31)
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/smhtt_ul/CMSSW_14_1_9, scram_arch: el9_amd64_gcc12}
