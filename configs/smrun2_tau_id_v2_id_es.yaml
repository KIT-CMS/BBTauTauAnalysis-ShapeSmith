# v2: the MC of smrun2_tau_id_v1 re-produced as smrun2_tau_id_v2 (the MET fix of 2026-10-18: DY and W recoil-corrected in
# 2018 only, so 2016 and 2017 have no recoil shifts; the POG muon_Z trigger SF on MC, E5), the data and the embedding stay
# in smrun2_tau_id_v1: ntuples.base is the data and embedding production, ntuples.bases the MC one. Skims and outputs
# under smrun2_tau_id_v2; the smrun2_tau_id_v1 run YAMLs keep reproducing the v1 results.
# Tau-ID scale factor and energy scale of the embedded taus (tau_id_measurement.py; v7 spec 5.4, E16), per era and
# 2016 half, on the tau-ID production smrun2_tau_id_v2 (P1: CROWN sm_tau_id_measurement_config, sample lists
# sm_<era>_tau_id_measurement.txt, scopes mt and mm, MC with all shifts, the embedding nominal). One YAML for every era:
#   shapesmith skim -c configs/smrun2_tau_id_v2_id_es.yaml -s era=<era>
#   for jet in Medium Tight; do for ele in VVLoose Tight; do
#     shapesmith measure -c configs/smrun2_tau_id_v2_id_es.yaml -s era=<era> -s switches.vsjet_wp=$jet -s switches.vsele_wp=$ele; done; done
#   shapesmith measure -c configs/smrun2_tau_id_v2_id_es.yaml -s era=<era> --merge
# -> <output_dir>/tau_id_es/<era>/<vsjet>_<vsele>/ and the payload DeepTau2018v2p5_id_es_embedding<era>UL.json.gz (U11:
# intervals from profile scans; `measure --refit` repeats the fits from the stored synced/ shapes). The tt-trigger
# measurement (smrun2_tau_id_v2_trigger.yaml) takes this payload as the energy scale of the embedded taus.
# Switches (types and defaults in switches.py):
#   sample_lists:      the tau-ID inventory of the era (W 0J/1J/2J, E17)
#   vsjet_wp:          Medium | Tight, the measured DeepTau vsJet working point
#   vsele_wp:          VVLoose | Tight, the DeepTau vsEle working point it is measured with
#   shape_systematics: true (default): the MC shape uncertainties of the shifts of P1 (E34 exception)
#   recoil_eras:       [2018]: the recoil shifts of DY and W exist in 2018 only (the MET fix, constants.RECOIL_ERAS)
# combine.cmssw_dir: a CMSSW_14_1_0_pre4 with CombineHarvester and TauIDSFMeasurement tauID_ES plus
# patches/TauIDSFMeasurement-tauID_ES.patch and SMRun2Legacy (patches/README.md).
analysis: bbtautau_shapesmith.tau_id_measurement:build
era: "2018"
channels: [mt, mm]
switches: {sample_lists: ["sm_{era}_tau_id_measurement"], vsjet_wp: Tight, vsele_wp: VVLoose, recoil_eras: ["2018"]}
sample_database: ../../KingMaker_sample_database/nanoAOD_v15/datasets.json   # sibling checkout; relative to this file
ntuples:
  server: root://cmsdcache-kit-disk.gridka.de
  base: /store/user/sdaigler/CROWN/ntuples/smrun2_tau_id_v1/CROWNRun      # the data and the embedding
  bases: {mc: /store/user/sdaigler/CROWN/ntuples/smrun2_tau_id_v2/CROWNRun}   # the MC: the re-production
  friends: []
skim_dir: /ceph/sdaigler/shapesmith/smrun2_tau_id_v2/skims/tau_id_es/{era}      # one skim for the four working-point combinations
output_dir: /ceph/sdaigler/shapesmith/smrun2_tau_id_v2/output                   # -> tau_id_es/<era>/
workers: 9                                                                       # also the categories fitted in parallel; at most 24 on portal2
log_level: DEBUG
combine: {cmssw_dir: /work/sdaigler/tau_id_es/CMSSW_14_1_0_pre4, scram_arch: el9_amd64_gcc12}
