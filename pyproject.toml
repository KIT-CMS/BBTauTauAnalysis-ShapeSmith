[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbtautau-shapesmith"
version = "0.1.0"
description = "Non-resonant HH->bbtautau analysis (2018 UL, NanoAODv15) on top of ShapeSmith"
requires-python = ">=3.11"
dependencies = ["shapesmith", "numpy>=1.26", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
